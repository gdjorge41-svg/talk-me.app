name: Build macOS Installer

on:
  workflow_dispatch: # Permite ejecutar la compilación manualmente con un botón desde GitHub

jobs:
  build-macos:
    runs-on: macos-latest # Máquina virtual oficial de macOS (Apple Silicon ARM64)
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "1"

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (LTS v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar herramientas de compilación Electron
        run: |
          cd talk-me.app_electron
          npm install

      - name: 4. Asignar permisos de ejecución a los scripts
        run: |
          chmod +x talk-me.app_electron/prepare-build.sh
          chmod +x talk-me.app_electron/create-dmg-hdiutil.sh
          chmod -R +x talk-me.app_electron/build/pkg-scripts 2>/dev/null || true

      - name: 5. Compilar bundle nativo macOS y empaquetar con hdiutil
        run: |
          cd talk-me.app_electron
          ./prepare-build.sh
          ./node_modules/.bin/electron-builder --mac --publish never
          ./create-dmg-hdiutil.sh

      - name: 6. Publicar instaladores como artefactos descargables
        uses: actions/upload-artifact@v4
        with:
          name: Talk-me-macOS-Installer
          path: |
            talk-me.app_electron/dist_final/*.pkg
            talk-me.app_electron/dist_final/*.dmg
            talk-me.app_electron/dist_final/*.zip
          retention-days: 14
