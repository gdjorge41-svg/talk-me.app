name: Build Linux Installer (AppImage & deb)

on:
  workflow_dispatch: # Permite compilar manualmente con un clic desde GitHub Actions

jobs:
  build-linux:
    runs-on: ubuntu-latest # Máquina virtual oficial de Linux (Ubuntu)
    env:
      ACTIONS_RUNNER_FORCE_NODE24: "1"

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v5

      - name: 2. Configurar Node.js (LTS v22)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 3. Instalar herramientas de compilación Electron
        run: |
          cd talk-me.app_electron
          npm install

      - name: 4. Asignar permisos de ejecución al script
        run: chmod +x talk-me.app_electron/prepare-build.sh

      - name: 5. Compilar instalador para Linux (AppImage y .deb)
        env:
          USE_HARD_LINKS: "false"
        run: |
          cd talk-me.app_electron
          ./prepare-build.sh
          ./node_modules/.bin/electron-builder --linux AppImage deb --publish never

      - name: 6. Publicar instaladores como artefactos descargables
        uses: actions/upload-artifact@v6
        with:
          name: Talk-me-Linux-Installer
          path: |
            talk-me.app_electron/dist_final/*.AppImage
            talk-me.app_electron/dist_final/*.deb
          retention-days: 14

