<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk-me</title>
    <link rel="icon" type="image/png" href="https://www.talk-me.app/favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap');

        :root {
            --bg-dark: #09080f;
            --card-bg: rgba(13, 12, 22, 0.75);
            --border-glow: rgba(123, 104, 238, 0.35);
            --accent: #7B68EE;
            --accent-hover: #6c5ce7;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Starfield background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            opacity: 0.25;
            z-index: 1;

        }




        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 45px 35px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon-wrapper {
            font-size: 64px;
            margin-bottom: 24px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .anim-party-stage {
            overflow: visible;
            filter: drop-shadow(0 6px 18px rgba(123, 104, 238, 0.45));
        }

        .party-popper-gun {
            transform-origin: 8px 25px;
            animation: gunOneShot 1.1s cubic-bezier(0.18, 0.9, 0.32, 1.2) forwards;
        }

        @keyframes gunOneShot {
            0% { transform: scale(0.92) rotate(-7deg); }
            30% { transform: scale(1.1) rotate(3.5deg); }
            60% { transform: scale(0.98) rotate(-1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .streamer-purple {
            transform-origin: 16.5px 14px;
            animation: streamerEmeraldFlow 2.6s ease-in-out infinite;
        }

        @keyframes streamerEmeraldFlow {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(1.2px, -2.2px) rotate(-4deg) scale(1.06); }
        }

        .streamer-orange {
            transform-origin: 19.5px 16px;
            animation: streamerOrangeFlow 2.8s ease-in-out infinite 0.25s;
        }

        @keyframes streamerOrangeFlow {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(2.2px, -1.2px) rotate(4.5deg) scale(1.06); }
        }

        .confetti-layer-1 {
            transform-origin: 18px 14px;
            animation: confettiFloatA 2.8s ease-in-out infinite;
        }

        .confetti-layer-2 {
            transform-origin: 20px 16px;
            animation: confettiFloatB 3.1s ease-in-out infinite 0.35s;
        }

        @keyframes confettiFloatA {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.92; }
            50% { transform: translate(1.6px, -2px) scale(1.08); opacity: 1; }
        }

        @keyframes confettiFloatB {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.92; }
            50% { transform: translate(2px, -1.4px) scale(1.08); opacity: 1; }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ffffff 0%, #b2a8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1.25;
        }

        p {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            background: var(--accent);
            color: var(--text-main);
            border: none;
            padding: 15px 30px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(123, 104, 238, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 104, 238, 0.45);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            cursor: default;
            transform: none;
        }
    </style>
</head>

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        // Detect language
        const urlParams = new URLSearchParams(window.location.search);
        const langCookie = getCookie('talkme_client_lang');
        const langLocal = localStorage.getItem('talkme_client_lang');
        const rawLang = urlParams.get('lang') || langLocal || langCookie || '';
        const langParam = rawLang.trim().slice(0, 2).toLowerCase();
        const browserLang = (navigator.language || navigator.userLanguage || 'es').slice(0, 2).toLowerCase();

            setTimeout(() => {
