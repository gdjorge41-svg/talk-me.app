<!DOCTYPE html>
<html lang="es" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Talk-me — Real App 1:1 Interface Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="talkme-app-body">
  <div class="main-layout">

    <!-- CONTROL PANEL (SIDEBAR IZQUIERDO DE TALK.ME CLONADO 1:1 DE control-panel.ejs) -->
    <aside class="control-panel" id="controlPanel">
      <button class="panel-toggle" id="panelToggle" title="Plegar / Desplegar Panel">
        <svg viewBox="0 0 10 24" width="10" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter">
          <polyline points="9,0 1,12 9,24"></polyline>
        </svg>
      </button>
      <div class="panel-content">

        <!-- LOGO OFICIAL TALK-ME -->
        <div class="sidebar-logo-container">
          <h2 class="sidebar-logo">
            <span class="logo-talk">Talk</span><span class="logo-sep">-</span><span class="logo-me">me</span>
          </h2>
        </div>

        <!-- Botón Ajustes Generales -->
        <div class="settings-main-btn-container">
          <button id="btnOpenMainSettings" class="settings-btn-premium">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
            <span id="lblGeneralSettings" data-i18n="chatSim.btnGeneralSettings">Ajustes Generales</span>
          </button>
        </div>

        <!-- Configuración de Audio -->
        <div class="sidebar-audio-config">
          <div class="setting-row">
            <label id="lblMicMode" data-i18n="chatSim.labelMicMode">Modo de Micrófono</label>
            <div class="talkme-select-container">
              <select id="micModeSelect" class="talkme-select">
                <option value="ptt" id="lblModePtt" data-i18n="chatSim.optPttText">Push-to-Talk (mantener)</option>
                <option value="auto" id="lblModeAuto" data-i18n="chatSim.optAutoText">Automático (por volumen)</option>
              </select>
              <div class="talkme-select-arrow">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <div class="setting-row">
            <label id="lblSensibilidad" data-i18n="chatSim.labelInputLevel">NIVEL DE ENTRADA</label>
            <div class="v41-meter-container">
              <div class="volume-meter">
                <div id="volumeLevel" class="volume-level"></div>
              </div>
              <input type="range" id="micSensitivity" min="0" max="100" value="50" style="display:none;">
            </div>
          </div>
        </div>

        <!-- 2. Lista de Usuarios Conectados (ICONO SVG 82x82 EXACTO DE CONTROL-PANEL.EJS) -->
        <div class="users-list-container">
          <h3 id="usersListTitle" class="users-title-with-icon">
            <svg class="users-list-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 82 82" width="18" height="18"
              aria-hidden="true" focusable="false">
              <g fill="currentColor">
                <path d="M48.355,17.922c3.705,2.323,6.303,6.254,6.776,10.817c1.511,0.706,3.188,1.112,4.966,1.112

c6.491,0,11.752-5.262,11.752-11.752s-5.262-11.751-11.752-11.751c-6.49,0-11.754,5.262-11.754,11.752S34.166,41.984,40.656,41.984

c7.918,2.474,14.797,3.299,20.459,3.299c11.059,0,17.469-3.153,17.864-3.354l0.785-0.397h0.084V57.833
C60.688,49.536,53.938,42.785,45.641,42.785z M65.084,30.653h-9.895c-0.107,3.959-1.797,7.524-4.47,10.088
c7.375,2.193,12.771,9.032,12.771,17.11v3.758c9.77-0.358,15.4-3.127,15.771-3.313l0.785-0.398h0.084V45.699
C80.13,37.403,73.38,30.653,65.084,30.653z M20.035,29.853c2.299,0,4.438-0.671,6.25-1.814c0.576-3.757,2.59-7.04,5.467-9.276
c0.012-0.22,0.033-0.438,0.033-0.66c0-6.491-5.262-11.752-11.75-11.752c-6.492,0-11.752,5.261-11.752,11.752
C8.283,24.591,13.543,29.853,20.035,29.853z M30.589,40.741c-2.66-2.551-4.344-6.097-4.467-10.032
c-0.367-0.027-0.73-0.056-1.104-0.056h-9.971C6.75,30.653,0,37.403,0,45.699v12.197l0.031,0.188l0.84,0.265
c6.352,1.983,12.021,2.897,16.945,3.185v-3.683C17.818,49.773,23.212,42.936,30.589,40.741z" />
              </g>
            </svg>
            <span class="users-list-text" id="lblUsersConnected" data-i18n="chatSim.lblUsersConnected">Usuarios
              Conectados (4)</span>

            <!-- 3. btn-add-subuser -->
            <button id="btn-add-subuser" class="btn-add-subuser" title="Crear Sub-usuario">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </h3>

          <div id="usersList" class="custom-scroll">

            <!-- 5. user-card-name - JORGE (Tú / Master) -->
            <div class="user-item own-user" id="userCardJorge" style="border-left-color: #7B68EE;">
              <div class="user-item-content-left">
                <span class="user-card-name" style="color: #7B68EE;">Jorge</span>
                <small class="category-tag-inline cat-produccion" id="badgeJorgeCat"
                  data-i18n="chatSim.catRegiduria">REGIDURIA</small>
                <small class="lang-tag-inline">ES</small>
              </div>
              <div class="user-item-content-right">
                <span class="own-tag" id="tagYou" data-i18n="chatSim.tagYou">(Tú)</span>
                <span class="master-crown-inline">👑</span>
              </div>
            </div>

            <!-- SOFÍA (Iluminación - FR) -->
            <div class="user-item" id="userCardSofia" style="border-left-color: #FF6B35;">
              <div class="user-item-content-left">
                <span class="user-card-name" style="color: #FF6B35;">Sofía</span>
                <small class="category-tag-inline cat-luzfx" id="badgeSofiaCat"
                  data-i18n="chatSim.catIluminacion">ILUMINACION</small>
                <small class="lang-tag-inline">FR</small>
              </div>
              <div class="user-item-content-right"></div>
            </div>

            <!-- CARLOS (Sonido - ES) -->
            <div class="user-item" id="userCardCarlos" style="border-left-color: #EAB308;">
              <div class="user-item-content-left">
                <span class="user-card-name" style="color: #FACC15;">Carlos</span>
                <small class="category-tag-inline cat-sonido" id="badgeCarlosCat"
                  data-i18n="chatSim.catSonido">SONIDO</small>
                <small class="lang-tag-inline">ES</small>
              </div>
              <div class="user-item-content-right"></div>
            </div>

            <!-- ELENA (Sub-usuario - Asistente) -->
            <div class="subuser-item" id="userCardElena" style="border-left-color: #10B981;">
              <div class="user-item-content-left">
                <span class="user-card-name" style="color: #10B981;">Elena</span>
                <small class="category-tag-inline cat-asistente" id="badgeElenaCat"
                  data-i18n="chatSim.catAsistente">ASISTENTE</small>
                <small class="lang-tag-inline">ES</small>
              </div>
              <div class="user-item-content-right">
                <span class="sub-tag" id="tagSubUser" data-i18n="chatSim.subUserTag">Sub-usuario</span>
              </div>
            </div>

          </div>
        </div>

        <div class="server-info">
          V1.0 Made with ♥ by Jorge.Lighting
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL DEL CHAT -->
    <main class="chat-area">
      <!-- 4. HEADER DEL CHAT (chat-header & header-status-subbar 1:1 con chat-area.ejs) -->
      <div class="chat-header">
        <div class="header-status-group">

          <div class="server-connection-top" id="connectionStatus">
            <span id="connectionStatusIP">https://192.168.0.4:3000/</span>
            <div class="status-icon-container blink-green" id="connectionStatusDot">
              <svg viewBox="0 0 24 24" class="status-icon-svg" width="10" height="10">
                <circle cx="12" cy="12" r="8" fill="#10B981"></circle>
              </svg>
            </div>
          </div>

          <div class="header-status-subbar">
            <!-- Botón Mute Global Oficial con SVG Completo -->
            <button id="btnMuteGlobal" class="btn-mute-global" title="Mute/Unmute">
              <svg viewBox="0 0 24 24" id="sound-max" class="icon flat-line"
                style="width: 22px; height: 22px; fill: currentColor; stroke: currentColor; transition: transform 0.2s;">
                <path id="mute_speaker_bg" d="M11,5V19L7,15H4a1,1,0,0,1-1-1V10A1,1,0,0,1,4,9H7Z" style="stroke: none;">
                </path>
                <path id="mute_wave_outer" d="M18.36,5.64a9,9,0,0,1,0,12.72"
                  style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5;"></path>
                <path id="mute_wave_inner" d="M15.54,8.46a5,5,0,0,1,0,7.08"
                  style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5;"></path>
                <path id="mute_speaker_outline" d="M11,5V19L7,15H4a1,1,0,0,1-1-1V10A1,1,0,0,1,4,9H7Z"
                  style="fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.5;"></path>
                <line id="mute_slash" x1="3" y1="3" x2="21" y2="21"
                  style="stroke: currentColor; stroke-width: 2.0; stroke-linecap: round; display: none;"></line>
              </svg>
            </button>

            <!-- Status Indicator Oficial -->
            <div class="status-indicator silent" id="statusIndicator">
              <svg class="status-indicator-svg" viewBox="0 0 24 24">
                <path class="mic-body" d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="22" />
              </svg>
              <span id="statusIndicatorText" data-i18n="chatSim.statusSilence">EN SILENCIO</span>
            </div>
          </div>

        </div>
      </div>

      <!-- BARRA DE FILTROS POR CATEGORÍA -->
      <div class="category-filter-bar" id="categoryFilterBar">
        <button class="filter-btn active pill-all" id="filterBtnTodos" data-filter="all"
          data-i18n="chatSim.filterAll">TODOS</button>
        <button class="filter-btn pill-regiduria" data-filter="regiduria"
          data-i18n="chatSim.catRegiduria">REGIDURIA</button>
        <button class="filter-btn pill-iluminacion" data-filter="iluminacion"
          data-i18n="chatSim.catIluminacion">ILUMINACION</button>
        <button class="filter-btn pill-sonido" data-filter="sonido" data-i18n="chatSim.catSonido">SONIDO</button>
      </div>

      <!-- CONTENEDOR DE MENSAJES DE CHAT REAL DE TALK.ME -->
      <div class="messages-container">

        <!-- POPUP FLOTANTE DE TRANSCRIPCIÓN STT EN DIRECTO -->
        <div class="top-transcript-popup" id="topTranscriptPopup">
          <span class="transcript-stt-text" id="transcriptSttText">...</span>
        </div>

        <div class="messages custom-scroll" id="messagesContainer">
          <!-- Tarjeta inicial estática para coincidencia 1:1 inmediata con la captura -->
          <div class="message own" data-cat="regiduria" style="border-right-color: #FF6B35;">
            <div class="message-sender">
              Jorge
              <small class="category-tag cat-produccion" data-i18n="chatSim.catRegiduria">REGIDURIA</small>
            </div>
            <div class="message-text">¡Hola equipo!</div>
            <div class="message-time">17:23:54</div>
          </div>
        </div>
      </div>

      <!-- 1. ÁREA DE INPUT CHAT CON btnSend POLIMÓRFICO 1:1 -->
      <div class="input-area">
        <button class="btn-attach" id="btnAttach" title="Enviar foto">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </button>

        <div class="input-wave-container" id="inputWaveContainer">
          <input type="text" class="text-input" id="textInput" placeholder="Escribe tu mensaje..."
            data-i18n-ph="chatSim.phTextInput">
          <div class="voice-wave" id="voiceWave"></div>
          <div class="vumeter-input-box" id="vumeterInputBox">
            <div class="vumeter-bar"></div>
            <div class="vumeter-bar"></div>

          </div>
        </div>

        <button class="btn-send" id="btnSend" title="Hablar / Enviar">
          <span id="btnSendText" style="display: none;">Enviar</span>
          <svg id="btnSendIcon" class="btn-send-svg" viewBox="0 0 24 24">
            <path class="mic-body" d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
          <svg id="btnSendArrowIcon" class="btn-send-svg" viewBox="0 0 24 24"
            style="display: none; fill: white; stroke: none;">
            <path d="M2,21L23,12L2,3V10L17,12L2,14V21Z" />
          </svg>
        </button>
      </div>

    </main>
  </div>

  <!-- DEPENDENCIAS JAVASCRIPT -->
  <script src="../web/js/translations.js"></script>
  <script src="script.js"></script>
</body>

</html>
