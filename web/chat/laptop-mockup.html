<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Talk-me | Mockup portátil</title>
    <link rel="stylesheet" href="laptop-mockup.css">
</head>
<body>
    <main class="mockup-viewport" aria-label="Talk-me en un portátil">
        <div class="mockup-pan-layer">
            <div class="mockup">
                <img class="devices" src="mockup_laptop+phone.png" alt="Mockup de un portátil y un teléfono">
                <div class="laptop-screen">
                    <iframe
                        src="ejemplo chat/Talk-me.htm?mockup=desktop-v11"
                        title="Aplicación web Talk-me"
                        sandbox="allow-same-origin"
                        loading="eager">
                    </iframe>
                </div>
                <div class="phone-screen">
                    <iframe
                        src="ejemplo chat/Talk-me.htm?mockup=mobile-v11"
                        title="Aplicación web Talk-me en vista móvil"
                        sandbox="allow-same-origin"
                        loading="eager">
                    </iframe>
                </div>
            </div>
        </div>
    </main>
    <script src="laptop-mockup.js"></script>
</body>
</html>
